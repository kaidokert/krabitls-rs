[package]
name = "krabitls"
version = "0.5.1"
edition = "2024"
rust-version = "1.87"
readme = "../README.md"
authors = ["kaidokert <kaidokert@gmail.com>"]
license = "Apache-2.0"
description = """
A TLS13 client lib for microcontrollers.
"""
repository = "https://github.com/kaidokert/krabitls-rs"
homepage = "https://github.com/kaidokert/krabitls-rs"
keywords = ["embedded", "no-std", "no-heap", "tls"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]

# docs.rs builds the crate once and serves that build to everyone. Default
# features omit RSA, ChaCha20, and jedisct, so
# the rendered API would otherwise hide those types. Force every feature
# on for the published docs and pass `--cfg docsrs` so feature-gated
# items can grow `#[cfg_attr(docsrs, doc(cfg(feature = "X")))]` badges
# without affecting normal builds.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["cert-der", "cipher-aes", "x25519-kx"]
# Route the gate-able secret-key ops through the deps' blinded/hedged paths
# against power/EM differential analysis: P-256 key exchange (blinder-at-keygen
# KEM personality) and RSA/ECDSA/Ed25519 client-auth signing (hedged randomized
# signers). Off by default — the unblinded primitives are the constant-time
# baseline; the countermeasures cost extra `.text`/entropy and target a physical-
# access threat model. Signing still draws its PSS salt / RFC 6979 nonce either way.
blinding = []
# Expose internal helpers that aren't part of the TLS 1.3 API
dev-utils = []
# Compile the cfg(test) backend carrier matrix (`src/backend_matrix.rs`), which
# references the git-only `_patched` dev-deps. Off by default so `cargo test` on
# the published crate — where cargo strips those git deps — still compiles; CI
# turns it on explicitly. Enables krabiecdsa's `test-vectors` (only if krabiecdsa
# is already pulled) for the raw-scalar ECDH known-answer rows.
backend-matrix = ["krabiecdsa?/test-vectors"]
# Test-only carrier-swap proof — recompile the stack on bnum / crypto-bigint.
# See `src/bigint/test_carriers.rs`. Enable one at a time.
carrier-bnum = []
carrier-crypto-bigint = []
# Bigint carrier config. Default (this feature OFF): per-role compile-time
# `FixedUInt` widths — one monomorphization per width, smallest per-algo. ON: a
# single runtime-length `HeaplessBigInt` (2048-bit CAP) with separate Nct+Ct
# carriers (two monomorphizations) — one width holds every algorithm, far less
# `.text` on multi-algo builds at a wider per-value footprint. Fixed is the
# absence of this feature, so `--no-default-features` still selects a carrier.
bigint-heapless = []
# RSA cert + CertificateVerify support (rsa_pss_rsae_sha256 + the self-signed
# cert's outer PKCS#1-v1.5). Pulls in rsa_heapless. The default (rsa-disabled)
# binary is untouched. `rsa` carries the mandatory 2048-bit width; enabling it
# alone is the 2048-only build (there is no subtractive `_only` knob). 1024/3072/
# 4096 are additive opt-ins below.
rsa = ["dep:rsa_heapless", "sha2/oid"]
# Additional RSA modulus widths (verify + cert-parse acceptance). Additive — each
# links its carrier + dispatch/parse arm on top of `rsa`'s 2048 baseline, so the
# default build (and the thumbv7m -Oz Bug-2 zone) stays byte-identical unless a
# width is opted in. RSA-1024 is legacy; 3072/4096 are non-critical.
rsa-1024 = ["rsa"]
rsa-3072 = ["rsa"]
rsa-4096 = ["rsa"]
# Alternate HKDF / SHA-256 backend wired to jedisct1's `hmac-sha256` crate
# (a standalone all-in-one impl with no `digest` / `crypto-common` /
# `generic-array` dependency). Pull this in when the binary should drop
# the RustCrypto `sha2 + hmac + hkdf + digest + crypto-common +
# generic-array` chain. AEAD stays on `aes-gcm` either way — jedisct1
# has no AES-GCM equivalent in the same family.
jedisct = ["dep:hmac-sha256"]
# Advertise TLS_CHACHA20_POLY1305_SHA256 alongside AES-128-GCM-SHA256. The raw
# `chacha20` stream cipher is pulled alongside the AEAD so the DTLS record-number
# mask (RFC 9147 §4.2.3) can key it; it is already a transitive dep of
# `chacha20poly1305`, so the direct entry adds no code to a TLS-only build.
chacha20 = ["dep:chacha20poly1305", "dep:chacha20"]
# DTLS 1.3 (RFC 9147) datagram client. Additive: parallel record/handshake
# modules under `src/dtls/`, reusing the TLS 1.3 key schedule, cipher suites, and
# verify path unchanged. A cipher (`cipher-aes` and/or `chacha20`) is required as
# for TLS.
# The DTLS 1.3 record/handshake path is X25519-only (it emits an X25519
# key_share and runs the ladder unconditionally), so it requires `x25519-kx`.
# P-256 DTLS key exchange is a separate future effort.
dtls = ["cert-der", "x25519-kx"]
# TLS_AES_128_GCM_SHA256 cipher suite. Default ON. Disable with
# `--no-default-features --features chacha20,...` for a ChaCha-only build
# (drops `aes-gcm` + `aes` + `ghash` deps). At least one of `cipher-aes`
# or `chacha20` must be active.
cipher-aes = ["dep:aes-gcm"]
# Allow a `ClientConfig` to select an external AES-128-GCM implementation that
# satisfies the `aead 0.6` traits (for example, an MCU hardware accelerator).
# The bundled RustCrypto implementation remains the default when this is off.
custom-aes = ["cipher-aes"]
# Sub-feature of `rsa`: drop the PKCS#1-v1.5 cert outer-signature path.
# Cert parser rejects `sha256WithRSAEncryption`; only `rsassa-pss` is
# accepted on cert outer signatures. Saves ~1 KiB .text vs the default
# (both schemes linked) at the cost of refusing PKCS#1-v1.5-signed RSA
# certs — i.e. most real-world CA-issued certs. For footprint demos and
# controlled-profile deployments where the cert is known to be PSS-signed.
# CertificateVerify always uses PSS for our advertised scheme so this
# feature doesn't affect handshake semantics.
rsa_pss_only = ["rsa"]
# Cert parser backend selector + `der` gate. On (default) → der-crate-backed
# parser, and the cert validity-window check (`.clocked()`) is available since
# it decodes UTCTime/GeneralizedTime through `der`. Off → in-tree TLV walker,
# `der` dropped entirely (~-4 KiB .text), and validity is unavailable (the
# default `NoClock` strategy is the only one that compiles).
cert-der = ["dep:der"]
# Match IP-literal hostnames against SAN `iPAddress` entries. Without it,
# IP literals fall through to `HostnameMismatch`. Saves ~2 KiB of
# `core::net::parser` on DNS-only embedded deployments. Default OFF.
ip-host = []
# Optional ML-DSA (FIPS 204) signature-verification backend, gated exactly
# like `rsa`. Pulls in krabipqc (no_std, no-alloc) which carries its own
# keccak/sha3 chain — none of it links into the default build. Verify only:
# the keygen/sign facade is test-only. Covers ML-DSA-44/65/87.
mldsa = ["dep:krabipqc"]
# Optional ML-KEM-768 (FIPS 203) key encapsulation, the client side of an
# `X25519MLKEM768` hybrid TLS key exchange. Same krabipqc dependency as `mldsa`;
# verification/handshake wiring is built on top in later steps.
mlkem = ["dep:krabipqc", "x25519-kx"]
# Optional ECDSA (P-256 + P-384) backend, gated like `rsa`/`mldsa`. Pulls in
# krabiecdsa (no_std, no-alloc) and turns on fixed-bigint's `cios` feature, which
# its `UnsignedModularInt` bound needs (modmath CIOS Montgomery mul). Covers
# `ecdsa_secp256r1_sha256` + `ecdsa_secp384r1_sha384` server-cert verification
# and, for mutual TLS, P-256/P-384 client-auth signing (`EcdsaClientAuth`, RFC
# 6979 deterministic nonce; constant-time — see its docs for the threat model).
# Signing links only when `EcdsaClientAuth` is constructed, so a verify-only
# build stays byte-identical, same as `rsa`.
ecdsa = ["dep:krabiecdsa", "fixed-bigint/cios"]
# Deprecated compat alias: signing folded into `ecdsa` (see above). Kept so
# downstream `--features ecdsa-sign` builds from 0.4.1 keep resolving without a
# breaking (0.5.0) bump; remove at the next minor.
ecdsa-sign = ["ecdsa"]
# Classical secp256r1 (P-256) ECDHE key exchange (named group 0x0017), the
# `key_share` side. Additive: advertised alongside the primary group (X25519, or
# X25519MLKEM768 under `mlkem`) so a build can offer P-256 and the hybrid at once
# — the server picks. Needed for gateways that refuse X25519 (e.g. Azure IoT).
# Pulls krabiecdsa's constant-time `ecdh` primitive (shares the CT carrier with
# the `ecdsa` verify path); orthogonal to `ecdsa` server-cert verification.
p256-kx = ["dep:krabiecdsa", "krabiecdsa/ecdh", "dep:kem", "fixed-bigint/cios"]
# X25519 (named group 0x001D) key exchange — the classical primary group.
# Default ON. Turn it OFF (`--no-default-features`) together with `p256-kx` to
# build a client that offers *only* secp256r1 ECDHE — no X25519 key_share, no
# Curve25519 ladder in the KX path — for an all-ECDSA/P-256 profile (e.g. AWS
# IoT). At least one key-exchange group (`x25519-kx` or `p256-kx`) must be on.
# `mlkem` (X25519MLKEM768) is a hybrid built on X25519, so it requires this.
# Pulls the `kem` crate: X25519 agreement runs through ed25519_heapless's
# X25519-as-KEM (blinder-at-keygen personality selected by `blinding`).
x25519-kx = ["dep:kem"]

[dependencies]
embedded-io = { version = "0.7.1", default-features = false }
hmac-sha256 = { version = "1", default-features = false, features = ["traits011"], optional = true }
rsa_heapless = { version = "0.5.0", default-features = false, features = ["modmath"], optional = true }

# RustCrypto next line — all share hybrid-array / crypto-common 0.2.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"], optional = true }
# Trait crate shared by aes-gcm + chacha20poly1305 (both use aead 0.6).
# Direct dep so the AEAD-trait imports stay valid even if `aes-gcm` later
# becomes an optional `feature = "cipher-aes"` dep.
aead = { version = "0.6", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
# Raw ChaCha20 stream cipher for the DTLS record-number mask (RFC 9147 §4.2.3);
# a transitive dep of `chacha20poly1305`, pinned here so the mask can key it.
chacha20 = { version = "0.10", default-features = false, features = ["zeroize"], optional = true }
# sha2 0.11 dropped the `force-soft-compact` Cargo feature; the compact soft
# SHA-256/512 core now lives behind `--cfg sha2_backend_soft="compact"`, set in
# the footprint targets' `.cargo/config.toml`. Without it, soft builds gain ~6.5 KiB.
sha2 = { version = "0.11", default-features = false }
digest = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
hkdf = { version = "0.13", default-features = false }
ed25519_heapless = { version = "0.6.0", default-features = false, features = ["sha512-sha2"] }
fixed-bigint = { version = "0.6", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
const-num-traits = { version = "0.2.1", default-features = false, features = ["ct"] }
der = { version = "0.8.0", default-features = false, features = ["oid"], optional = true }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
heapless = { version = "0.9", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror = { version = "2", default-features = false }
signature = { version = "3", default-features = false }
rand_core = { version = "0.10", default-features = false }
krabipqc = { version = "0.1.4", default-features = false, optional = true }
krabiecdsa = { version = "0.7.0", default-features = false, optional = true }
# ECDH-as-KEM types (Ciphertext/SharedKey/Array + traits) for the blinded P-256
# key exchange; krabiecdsa exposes ECDH only through the `kem` traits.
kem = { version = "0.3", default-features = false, optional = true }

# Deterministic SeededRng + CannedTransport for the host facade replay
# tests. Dev-only so the seed-mode RNG (a `TryCryptoRng` that is NOT a
# CSPRNG) never reaches a published build. The dev-dependency cycle back to
# krabitls is allowed by Cargo. `default-features = false` so the fixtures
# crate inherits whatever cipher this test build selects instead of forcing
# `cipher-aes`.
[dev-dependencies]
krabitls_fixtures = { path = "../krabitls_fixtures", default-features = false }

# Backend carrier matrix (see `src/backend_matrix.rs`): the `_patched` forks add
# the const-num-traits + modmath-cios impls upstream lacks, so bnum and
# crypto-bigint can stand in as `crate::bigint` carriers in tests. Git dev-deps
# are stripped from the published manifest (as modmath does), so these have zero
# publish impact. Tags track the modmath 0.6 line.
bnum_patched = { package = "bnum", git = "https://github.com/kaidokert/bnum.git", tag = "v0.14.4-const-20", default-features = false, features = ["zeroize"] }
crypto-bigint_patched = { package = "crypto-bigint", git = "https://github.com/kaidokert/crypto-bigint.git", tag = "v0.7.5-const-20", default-features = false, features = ["zeroize", "subtle"] }
