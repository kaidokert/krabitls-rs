[package]
name = "krabitls"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Expose internal helpers that aren't part of the TLS 1.3 API
dev-utils = []
# Optional RSA cert + CertificateVerify support (rsa_pss_rsae_sha256 + the
# self-signed cert's outer PKCS#1-v1.5). Pulls in rsa_heapless 0.2 (verify-only
# on the heapless path) plus sha2 0.11 under a renamed package — rsa_heapless
# builds on digest 0.11, one major ahead of the digest 0.10 we use for HKDF /
# transcript hashing, so the two sha2 versions sit side-by-side in an
# rsa-enabled build. ~1-2 KiB duplicate SHA-256 code is the cost of opting in;
# the default (rsa-disabled) binary is untouched. Supports both 1024-bit and
# 2048-bit RSA moduli via runtime dispatch.
rsa = ["dep:rsa_heapless", "dep:sha2_v11"]
# Alternate HKDF / SHA-256 backend wired to jedisct1's `hmac-sha256` crate
# (a standalone all-in-one impl with no `digest` / `crypto-common` /
# `generic-array` dependency). Pull this in when the binary should drop
# the RustCrypto `sha2 + hmac + hkdf + digest + crypto-common +
# generic-array` chain. AEAD stays on `aes-gcm` either way — jedisct1
# has no AES-GCM equivalent in the same family.
jedisct = ["dep:hmac-sha256"]
# Cert `notBefore` / `notAfter` validity-window check + the [`TimeSource`]
# trait. krabitls is sans-io / no-clock; this feature adds the optional
# contract a caller can use IF it has a clock. Embedded targets without an
# RTC build with the feature OFF (default) and pay no code-size cost for
# either the check or the trait.
validity = []
# Advertise TLS_CHACHA20_POLY1305_SHA256 alongside AES-128-GCM-SHA256.
chacha20 = ["dep:chacha20poly1305"]

[dependencies]
embedded-io = { version = "0.7.1", default-features = false }
hmac-sha256 = { version = "1", default-features = false, optional = true }
rsa_heapless = { version = "0.2.1", default-features = false, features = ["modmath"], optional = true }
sha2_v11 = { package = "sha2", version = "0.11", default-features = false, features = ["oid"], optional = true }

# RustCrypto stable line — all share generic-array 0.14 / crypto-common 0.1.
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
ed25519_heapless = { version = "0.0.3", default-features = false, features = ["fixed-bigint", "sha512-sha2"] }
fixed-bigint = { version = "0.3", default-features = false, features = ["use-unsafe", "zeroize"] }
der = { version = "0.8.0", default-features = false, features = ["oid"] }
zeroize = { version = "1.8", default-features = false }
heapless = { version = "0.9", default-features = false }
