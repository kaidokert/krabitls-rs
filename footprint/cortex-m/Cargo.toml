[package]
name = "footprint_cortex_m"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
default = ["cert-der", "cipher-aes"]
# Default `der`-crate cert parser. Drop with `--no-default-features
# --features cipher-aes,...` to swap in the hand-rolled TLV walker and
# strip the `der` dep.
cert-der = ["footprint_handshakes/cert-der"]
# Default AES-128-GCM cipher suite. Pass `--no-default-features
# --features chacha20` to build a ChaCha-only binary.
cipher-aes = ["footprint_handshakes/cipher-aes"]
# Strip the krabitls + crypto path from each example, leaving the harness +
# panic/fmt + a black_box stub touching every captured fixture. The
# `.text(real) - .text(baseline)` delta is the honest cost of the TLS + crypto.
baseline = []
# `krabitls_jedisct` example: swaps the HKDF/SHA-256 backend from RustCrypto
# to jedisct1's `hmac-sha256`.
jedisct = ["footprint_handshakes/jedisct"]
# `krabitls_rsa` example: replays a captured local-server handshake with an
# RSA-2048 cert; exercises RSA-PKCS#1-v1.5 self-sig + RSA-PSS CertificateVerify.
rsa = ["footprint_handshakes/rsa"]
# Post-quantum cost layered onto the AES+Ed25519 `krabitls` example: the
# X25519MLKEM768 hybrid KEX (`mlkem`) and/or ML-DSA-44 server-cert verification
# (`mldsa`). For `.text` the reachable PQC code links via `connect()`.
mlkem = ["footprint_handshakes/mlkem"]
mldsa = ["footprint_handshakes/mldsa"]
ecdsa = ["footprint_handshakes/ecdsa"]
# `krabitls_p256` example: secp256r1 (P-256) ECDHE key exchange with an
# ECDSA-P256 server cert (a fully coherent all-P-256 handshake), replayed from
# the seed-0 P-256 + ECDSA capture.
p256-kx = ["footprint_handshakes/p256-kx"]
# `krabitls_ecdsa_mtls` / `krabitls_ed25519_mtls` / `krabitls_rsa_mtls` examples:
# client authentication — the client answers a CertificateRequest with its own
# cert + CertificateVerify, linking the client-auth signing path. The client
# cert's key type is selected by the paired sig feature (`ecdsa`, `rsa`, or bare
# for Ed25519).
client-auth = ["footprint_handshakes/client-auth"]
# `krabitls_chacha` example: same Ed25519 fixture as `krabitls` but with the
# AEAD swapped to ChaCha20-Poly1305.
chacha20 = ["footprint_handshakes/chacha20"]
# `krabitls_facade` example: drives the full facade
# (`DefaultStream::connect`) through the seed-0 canned fixtures via
# `SeededRng` + `CannedTransport`.
canned-replay = ["footprint_handshakes/canned-replay"]
full-stack = ["footprint_handshakes/full-stack"]
bigint-heapless = ["footprint_handshakes/bigint-heapless"]
# Opt-in size-clawback feature: forward to footprint_handshakes / krabitls.
ip-host = ["footprint_handshakes/ip-host"]
# STM32F407/J-Trace execution with RTT reporting and an adjacent DWT reading.
jtrace-f407 = [
    "dep:stm32f4xx-hal",
    "krabi-caliper/cortex-m-dwt",
    "krabi-caliper/rtt",
]

[[example]]
name = "krabitls"
required-features = ["canned-replay"]

[[example]]
name = "krabitls_mtls"
required-features = ["cipher-aes", "canned-replay"]

[[example]]
name = "krabitls_jedisct"
required-features = ["jedisct", "canned-replay"]

[[example]]
name = "krabitls_rsa"
required-features = ["rsa", "canned-replay"]

[[example]]
name = "krabitls_chacha"
required-features = ["chacha20", "canned-replay"]

[[example]]
name = "krabitls_validity"
required-features = ["cert-der", "cipher-aes", "canned-replay"]

[[example]]
name = "krabitls_mlkem"
required-features = ["mlkem", "canned-replay"]

[[example]]
name = "krabitls_mldsa"
required-features = ["mldsa", "canned-replay"]

[[example]]
name = "krabitls_ecdsa"
required-features = ["ecdsa", "canned-replay"]

[[example]]
name = "krabitls_ecdsa_mtls"
required-features = ["ecdsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_p256"
required-features = ["p256-kx", "ecdsa", "canned-replay"]

[[example]]
name = "krabitls_p256_mtls"
required-features = ["p256-kx", "ecdsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_ed25519_mtls"
required-features = ["client-auth", "canned-replay"]

[[example]]
name = "krabitls_rsa_mtls"
required-features = ["rsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_rsa_mtls_srv"
required-features = ["rsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_chacha_mtls"
required-features = ["chacha20", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_mlkem_mldsa"
required-features = ["mlkem", "mldsa", "canned-replay"]

[[example]]
name = "krabitls_chacha_mlkem_mldsa"
required-features = ["chacha20", "mlkem", "mldsa", "canned-replay"]

[dependencies]
# `critical-section-single-core` registers a single-core critical-section
# backend (used by `footprint_handshakes::with_buffers` and by
# `portable-atomic` on thumbv6m).
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
krabi-caliper = { version = "0.1.4", features = ["cortex-m", "semihosting", "stack"] }
# Custom #[panic_handler] in src/lib.rs — drops the panic-semihosting
# crate's core::fmt machinery (~3 KiB) while keeping the QEMU-FAILURE
# exit on panic so CI surfaces failures rather than hanging.

footprint_handshakes = { path = "../handshakes", default-features = false }
stm32f4xx-hal = { version = "0.22", features = ["stm32f407"], optional = true }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
[[example]]
name = "krabitls_full"
required-features = ["full-stack", "canned-replay"]

[[example]]
name = "krabitls_chain"
required-features = ["ecdsa", "canned-replay"]
