[package]
name = "footprint_cortex_m"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
# Strip the krabitls + crypto path from each example, leaving the harness +
# panic/fmt + a black_box stub touching every captured fixture. The
# `.text(real) - .text(baseline)` delta is the honest cost of the TLS + crypto.
baseline = []
# `krabitls_jedisct` example: swaps the HKDF/SHA-256 backend from RustCrypto
# to jedisct1's `hmac-sha256`.
jedisct = ["footprint_handshakes/jedisct"]
# `krabitls_rsa` example: replays a captured local-server handshake with an
# RSA-2048 cert; exercises RSA-PKCS#1-v1.5 self-sig + RSA-PSS CertificateVerify.
rsa = ["footprint_handshakes/rsa"]
# `krabitls_chacha` example: same Ed25519 fixture as `krabitls` but with the
# AEAD swapped to ChaCha20-Poly1305.
chacha20 = ["footprint_handshakes/chacha20"]
# `krabitls_facade` example: drives the full facade
# (`DefaultStream::connect`) through the seed-0 canned fixtures via
# `SeededRng` + `CannedTransport`.
canned-replay = ["footprint_handshakes/canned-replay"]
# Opt-in size-clawback features: forward to footprint_handshakes / krabitls.
cert-tlv = ["footprint_handshakes/cert-tlv"]
ip-host = ["footprint_handshakes/ip-host"]

[[example]]
name = "krabitls"

[[example]]
name = "krabitls_jedisct"
required-features = ["jedisct"]

[[example]]
name = "krabitls_rsa"
required-features = ["rsa"]

[[example]]
name = "krabitls_chacha"
required-features = ["chacha20"]

[[example]]
name = "krabitls_facade"
required-features = ["canned-replay"]

[dependencies]
# `critical-section-single-core` registers a single-core critical-section
# backend (used by `footprint_handshakes::with_buffers` and by
# `portable-atomic` on thumbv6m).
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
# Custom #[panic_handler] in src/lib.rs — drops the panic-semihosting
# crate's core::fmt machinery (~3 KiB) while keeping the QEMU-FAILURE
# exit on panic so CI surfaces failures rather than hanging.
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

footprint_handshakes = { path = "../handshakes" }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
