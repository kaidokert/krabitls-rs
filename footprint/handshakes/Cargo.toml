[package]
name = "footprint_handshakes"
version = "0.1.0"
edition = "2024"

# Shared `no_std` library for the footprint demos. Owns the captured TLS 1.3
# handshake fixtures and the per-variant `run_*()` bodies so the cortex-m
# and risc-v target crates can both link the same code and measure the same
# `.text` / stack against their respective baselines.

[features]
default = ["cert-der", "cipher-aes"]
# Default `der`-crate cert parser. Forwarded so the cortex-m demo can
# `--no-default-features --features cipher-aes,...` to swap in the
# hand-rolled TLV walker and drop the `der` dep.
cert-der = ["krabitls/cert-der"]
# Default AES-128-GCM cipher suite. Forwarded so the cortex-m demo can
# `--no-default-features --features chacha20` to actually drop `aes-gcm`.
# `krabitls_fixtures?/cipher-aes` keeps the fixtures crate's transitive
# krabitls build on the same cipher we measure (no-op when canned-replay off).
cipher-aes = ["krabitls/cipher-aes", "krabitls_fixtures?/cipher-aes"]
# Optional ChaCha20-Poly1305 + RSA-PSS variants follow the krabitls feature
# wiring so each target crate can include or exclude them.
chacha20 = ["krabitls/chacha20", "krabitls_fixtures?/chacha20"]
# Footprint replays a PSS-signed RSA-2048 captured cert; enable both
# rsa_pss_only (drops PKCS#1-v1.5) and rsa_2048_only (drops U1024) so LTO
# strips the unreachable paths from the M3/RV measurement.
rsa = ["krabitls/rsa", "krabitls/rsa_pss_only", "krabitls/rsa_2048_only"]
# X25519MLKEM768 hybrid key exchange and/or ML-DSA-44 server-cert verification
# (post-quantum). `SeededRng` carries the ML-KEM keygen entropy unconditionally,
# so no fixtures-crate feature is forwarded.
mlkem = ["krabitls/mlkem"]
mldsa = ["krabitls/mldsa"]
# ECDSA P-256 server-cert verification (secp256r1 / SHA-256).
ecdsa = ["krabitls/ecdsa"]
# Fully-featured verify surface — plain krabitls/rsa (both U1024+U2048,
# both PKCS1v15+PSS), all sig algos. NOT footprint `rsa` (that forces rsa_2048_only).
full-stack = ["krabitls/rsa", "krabitls/ecdsa", "krabitls/mldsa", "krabitls/mlkem"]
# Forward the unified heapless carrier so the probes can measure it against the
# default per-role FixedUInt carrier.
bigint-heapless = ["krabitls/bigint-heapless"]
jedisct = ["krabitls/jedisct"]
# Full handshake via `DefaultStream::connect` against the captured seed-0
# fixtures (SeededRng + CannedTransport), now in the krabitls_fixtures crate.
canned-replay = ["dep:krabitls_fixtures"]
# Opt-in size-clawback feature: re-enables IP-literal SAN matching
# that the embedded default skips (+2 KiB).
ip-host = ["krabitls/ip-host"]

[dependencies]
krabitls = { path = "../../krabitls", default-features = false, features = ["dev-utils"] }
krabitls_fixtures = { path = "../../krabitls_fixtures", default-features = false, optional = true }
critical-section = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
