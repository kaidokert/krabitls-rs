[package]
name = "footprint_riscv"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
# See `footprint_cortex_m/Cargo.toml` — same feature semantics for the
# baseline / jedisct / rsa / chacha20 rows. Wired through `footprint_handshakes`.
default = ["cert-der", "cipher-aes"]
baseline = []
jedisct = ["footprint_handshakes/jedisct"]
rsa = ["footprint_handshakes/rsa"]
mlkem = ["footprint_handshakes/mlkem"]
mldsa = ["footprint_handshakes/mldsa"]
ecdsa = ["footprint_handshakes/ecdsa"]
# `krabitls_p256` example: secp256r1 (P-256) ECDHE key exchange with an
# ECDSA-P256 server cert (a fully coherent all-P-256 handshake), replayed from
# the seed-0 P-256 + ECDSA capture.
p256-kx = ["footprint_handshakes/p256-kx"]
# `krabitls_ecdsa_mtls` / `krabitls_ed25519_mtls` / `krabitls_rsa_mtls` examples:
# client authentication — the client answers a CertificateRequest with its own
# cert + CertificateVerify, linking the client-auth signing path. The client
# cert's key type is selected by the paired sig feature (`ecdsa`, `rsa`, or bare
# for Ed25519).
client-auth = ["footprint_handshakes/client-auth"]
chacha20 = ["footprint_handshakes/chacha20"]
cert-der = ["footprint_handshakes/cert-der"]
cipher-aes = ["footprint_handshakes/cipher-aes"]
canned-replay = ["footprint_handshakes/canned-replay"]
full-stack = ["footprint_handshakes/full-stack"]
bigint-heapless = ["footprint_handshakes/bigint-heapless"]

[[example]]
name = "krabitls"
required-features = ["canned-replay"]

[[example]]
name = "krabitls_jedisct"
required-features = ["jedisct", "canned-replay"]

[[example]]
name = "krabitls_rsa"
required-features = ["rsa", "canned-replay"]

[[example]]
name = "krabitls_chacha"
required-features = ["chacha20", "canned-replay"]

[[example]]
name = "krabitls_mlkem"
required-features = ["mlkem", "canned-replay"]

[[example]]
name = "krabitls_mldsa"
required-features = ["mldsa", "canned-replay"]

[[example]]
name = "krabitls_ecdsa"
required-features = ["ecdsa", "canned-replay"]

[[example]]
name = "krabitls_ecdsa_mtls"
required-features = ["ecdsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_p256"
required-features = ["p256-kx", "ecdsa", "canned-replay"]

[[example]]
name = "krabitls_p256_mtls"
required-features = ["p256-kx", "ecdsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_ed25519_mtls"
required-features = ["client-auth", "canned-replay"]

[[example]]
name = "krabitls_rsa_mtls"
required-features = ["rsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_rsa_mtls_srv"
required-features = ["rsa", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_chacha_mtls"
required-features = ["chacha20", "client-auth", "canned-replay"]

[[example]]
name = "krabitls_mlkem_mldsa"
required-features = ["mlkem", "mldsa", "canned-replay"]

[[example]]
name = "krabitls_chacha_mlkem_mldsa"
required-features = ["chacha20", "mlkem", "mldsa", "canned-replay"]

[dependencies]
riscv-rt = "0.13"
# Single-hart critical-section backend so `footprint_handshakes::with_buffers`
# can take a critical section on QEMU's virt machine (single hart, no SMP).
riscv = { version = "0.12", features = ["critical-section-single-hart"] }
riscv-semihosting = "0.2"
krabi-caliper = { version = "0.1.4", features = ["risc-v", "stack"] }

footprint_handshakes = { path = "../handshakes", default-features = false }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"
# Suppress unwind tables / `.eh_frame`; otherwise the rust-lld RV32 PCREL
# relocations overflow once the binary grows past a few KiB.
panic = "abort"
[[example]]
name = "krabitls_full"
required-features = ["full-stack", "canned-replay"]
