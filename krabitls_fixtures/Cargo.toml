[package]
name = "krabitls_fixtures"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

# Deterministic test infrastructure for krabitls: `SeededRng` (seed-mode
# entropy that mirrors the Python `tls_fixture` byte-for-byte) and
# `CannedTransport` (in-memory replay of captured server flights). Lives in
# its own unpublished crate so `SeededRng` — which implements
# `rand_core::TryCryptoRng` but is NOT a CSPRNG — can never be reached from a
# real krabitls build.

# krabitls's lib doesn't compile without a cipher suite *and* a key-exchange
# group, so forward one of each. The fixtures code itself is cipher/KX-independent
# (only `Transport` + SHA-256); these flags exist purely to let a *standalone*
# krabitls_fixtures build resolve its underlying krabitls. Forwarded via the
# *default* (not the dependency's `features`) so that when krabitls dev-deps this
# crate, `default-features = false` forwards nothing and the fixtures inherit
# krabitls's actual per-test config through feature unification — which keeps a
# P-256-only (`x25519-kx` off) krabitls testable rather than pinning X25519 on.
[features]
default = ["cipher-aes", "x25519-kx"]
cipher-aes = ["krabitls/cipher-aes"]
chacha20 = ["krabitls/chacha20"]
x25519-kx = ["krabitls/x25519-kx"]

[dependencies]
krabitls = { path = "../krabitls", default-features = false }
sha2 = { version = "0.11", default-features = false }
rand_core = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false }
