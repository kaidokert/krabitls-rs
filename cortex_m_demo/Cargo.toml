[package]
name = "cortex_m_demo"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
# Strip the krabitls + ed25519 + AES-GCM call sites from `examples/krabitls.rs`,
# leaving just the harness, panic/fmt machinery, and a stub that touches every
# fixture buffer. The difference (`.text(real) - .text(baseline)`) is the
# honest cost of the TLS+crypto code itself.
baseline = []
# Build the krabitls_jedisct example, which swaps the HKDF / SHA-256 backend
# from RustCrypto to jedisct1's `hmac-sha256`. AEAD stays on `aes-gcm`.
# Same fixture as the `krabitls` example, just a different HKDF impl —
# useful for comparing kcycles between the two backends on M3.
jedisct = ["krabitls/jedisct"]
# Build the krabitls_rsa example, which replays a captured example.com
# handshake (RSA-2048 cert chain) on M3 — exercises cert parse + the
# RSA-PKCS#1-v1.5 self-sig verify and the RSA-PSS CertificateVerify verify.
# M3-only: the example's 8 KiB plaintext + 8 KiB flight buffers overflow
# microbit's 16 KiB RAM, so CI skips thumbv6m for this example.
rsa = ["krabitls/rsa"]

[[example]]
name = "krabitls"

[[example]]
name = "krabitls_jedisct"
required-features = ["jedisct"]

[[example]]
name = "krabitls_rsa"
required-features = ["rsa"]

[dependencies]
# `critical-section-single-core` provides a critical-section implementation
# so `portable-atomic` can emulate AtomicU32 / AtomicUsize on thumbv6m
# (Cortex-M0/M0+), which lacks native 32-bit atomics. On v7m+ targets the
# native atomic instructions are used and the critical-section impl is
# dead code.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

krabitls = { path = "../krabitls", features = ["dev-utils"] }
ed25519_heapless = { version = "0.0.3", default-features = false, features = ["fixed-bigint", "sha512-sha2"] }
fixed-bigint = { version = "0.3", default-features = false, features = ["use-unsafe"] }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
