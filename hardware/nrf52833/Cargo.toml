[package]
name = "krabitls-hw-nrf52833"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false
license = "Apache-2.0"
description = "nRF52833 hardware cryptography backends for KrabiTLS"

[dependencies]
aes-gcm = { version = "0.11", default-features = false }
cipher = { version = "0.5", default-features = false }
cortex-m = "0.7.8"
krabitls = { path = "../../krabitls", default-features = false, features = ["cipher-aes", "x25519-kx"] }
nrf52833-hal = { version = "0.19.0", default-features = false }
zeroize = { version = "1.8", default-features = false }
