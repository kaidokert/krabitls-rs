[package]
name = "krabitls_cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
autobins = false

[features]
# Cert validity-window checking is always compiled in krabitls; the CLI
# supplies a `SystemTimeSource` clock so it's active by default.
default = []
rsa = ["krabitls/rsa"]
# ECDSA P-256/P-384 server-cert verification.
ecdsa = ["krabitls/ecdsa"]
# Advertise TLS_CHACHA20_POLY1305_SHA256 alongside AES-128-GCM-SHA256.
chacha20 = ["krabitls/chacha20"]

[dependencies]
krabitls = { version = "0.4.0", path = "../krabitls", features = ["ip-host"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1.8", default-features = false }

# The only CLI binary. Talks to public-internet servers via the
# `krabitls::client` facade. RSA verify is required because most public
# servers present RSA leaf certs.
[[bin]]
name = "krabitls_connect"
required-features = ["rsa"]

# EXPERIMENT (heap-verify): unify modmath on the 0.6.1-alpha.1 git tag, matching
# the krabitls dep it builds. Reverts to registry when modmath 0.6.1 publishes.
[patch.crates-io]
modmath = { git = "https://github.com/kaidokert/modmath-rs.git", tag = "v0.6.1-alpha.1" }
