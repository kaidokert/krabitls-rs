[package]
name = "krabitls_cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
autobins = false

[features]
# Cert validity-window checking is always compiled in krabitls; the CLI
# supplies a `SystemTimeSource` clock so it's active by default.
default = []
rsa = ["krabitls/rsa"]
# Advertise TLS_CHACHA20_POLY1305_SHA256 alongside AES-128-GCM-SHA256.
chacha20 = ["krabitls/chacha20"]

[dependencies]
krabitls = { version = "0.2.0", path = "../krabitls", features = ["ip-host"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1.8", default-features = false }

# The only CLI binary. Talks to public-internet servers via the
# `krabitls::client` facade. RSA verify is required because most public
# servers present RSA leaf certs.
[[bin]]
name = "krabitls_connect"
required-features = ["rsa"]

# TEMPORARY (PR #94): coordinated pre-release up-rev — see krabitls/Cargo.toml.
# Public git tags, so CI can fetch them. Drop as real releases land.
[patch.crates-io]
const-num-traits = { git = "https://github.com/kaidokert/num-traits", tag = "v0.2.0-alpha.1" }
fixed-bigint = { git = "https://github.com/kaidokert/fixed-bigint-rs", tag = "v0.5.0-alpha.3" }
modmath = { git = "https://github.com/kaidokert/modmath-rs", tag = "v0.5.0-alpha.3" }
rsa_heapless = { git = "https://github.com/kaidokert/RSA", tag = "v0.3.0-alpha.2" }
krabipqc = { git = "https://github.com/kaidokert/krabipqc-rs", tag = "v0.1.3-alpha.2" }
ed25519_heapless = { git = "https://github.com/kaidokert/ed25519", tag = "v0.4.0-alpha.1" }
