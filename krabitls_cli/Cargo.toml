[package]
name = "krabitls_cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
default = []
rsa = ["krabitls/rsa"]
ecdsa = ["krabitls/ecdsa"]
chacha20 = ["krabitls/chacha20"]

[dependencies]
krabitls = { version = "0.4.0", path = "../krabitls", features = ["ip-host"] }
embedded-nal = "0.9"
embedded-io = "0.7"
std-embedded-nal = "0.4"
nb = "1"
rand_core = { version = "0.10", default-features = false }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
krabitls_fixtures = { path = "../krabitls_fixtures" }

[[bin]]
name = "krabitls_connect"
path = "src/bin/krabitls_connect.rs"
