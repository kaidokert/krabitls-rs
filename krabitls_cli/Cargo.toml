[package]
name = "krabitls_cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
autobins = false

[features]
# `validity` is free because std::time::SystemTime is always available on
# the CLI build target.
default = ["krabitls/validity"]
rsa = ["krabitls/rsa"]
# Advertise TLS_CHACHA20_POLY1305_SHA256 alongside AES-128-GCM-SHA256.
chacha20 = ["krabitls/chacha20"]

[dependencies]
krabitls = { version = "0.1.0", path = "../krabitls", features = ["ip-host"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

# The only CLI binary. Talks to public-internet servers via the
# `krabitls::client` facade. RSA verify is required because most public
# servers present RSA leaf certs.
[[bin]]
name = "krabitls_connect"
required-features = ["rsa"]
