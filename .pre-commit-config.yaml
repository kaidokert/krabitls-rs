repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: mixed-line-ending
        args: ["--fix=lf"]

-   repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    -   id: fmt
        name: Fmt for krabitls
        args: ['--manifest-path=krabitls/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_cli
        args: ['--manifest-path=krabitls_cli/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_fixtures
        args: ['--manifest-path=krabitls_fixtures/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint_handshakes
        args: ['--manifest-path=footprint/handshakes/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint cortex-m
        args: ['--manifest-path=footprint/cortex-m/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint risc-v
        args: ['--manifest-path=footprint/risc-v/Cargo.toml', '--']

# Local hooks: a fast core only — `git commit` should finish in seconds, not
# minutes. Only lib/bin clippy on default features runs here; anything that
# compiles or runs the integration tests (the canned-handshake replays) is too
# slow for every commit and belongs to CI, which already owns it: default +
# feature-combo tests and `--all-targets` clippy in `host` (rust.yml), the
# `cargo hack` feature-powerset there too, the cross-compiled size builds in
# `footprint.yml`, and nightly/coverage in their own workflows.
-   repo: local
    hooks:
    -   id: krabitls-clippy-default
        name: clippy krabitls (default, lib+bin)
        # No --tests/--all-targets: linting the integration-test binaries pulls
        # in the canned-handshake fixtures and dominates commit latency. CI runs
        # the full --all-targets sweep across the feature matrix.
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
