repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: mixed-line-ending
        args: ["--fix=lf"]

-   repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    -   id: fmt
        name: Fmt for krabitls
        args: ['--manifest-path=krabitls/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_cli
        args: ['--manifest-path=krabitls_cli/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_fixtures
        args: ['--manifest-path=krabitls_fixtures/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint_handshakes
        args: ['--manifest-path=footprint/handshakes/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint cortex-m
        args: ['--manifest-path=footprint/cortex-m/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint risc-v
        args: ['--manifest-path=footprint/risc-v/Cargo.toml', '--']

# Local hooks: a fast core only. `git commit` should catch the embarrassing
# stuff in seconds; CI owns the exhaustive matrix. The feature-combo clippy/
# build/test sweeps live in `host` (rust.yml), the cross-compiled size builds
# in `footprint.yml`, the `cargo hack` feature-powerset in `host`, and the
# nightly/coverage combos in their own workflows — none of that needs to run
# on every local commit.
-   repo: local
    hooks:
    -   id: krabitls-clippy-default
        name: clippy krabitls (default)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    # Default features (cert-der + cipher-aes, no chacha) — this run also
    # exercises the AES seed-0 canned-replay integration test. Other feature
    # combos run in CI.
    -   id: krabitls-test
        name: test krabitls (default)
        entry: cargo test --manifest-path=krabitls/Cargo.toml
        language: system
        pass_filenames: false
        files: ^(krabitls|krabitls_fixtures|testdata)/.*\.(rs|toml|hex|md)$

    -   id: krabitls-fixtures-clippy
        name: clippy krabitls_fixtures
        entry: cargo clippy --manifest-path=krabitls_fixtures/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(krabitls_fixtures|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-fixtures-test
        name: test krabitls_fixtures (seed KATs)
        entry: cargo test --manifest-path=krabitls_fixtures/Cargo.toml
        language: system
        pass_filenames: false
        files: ^(krabitls_fixtures|krabitls)/.*\.(rs|toml)$
