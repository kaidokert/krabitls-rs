repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: mixed-line-ending
        args: ["--fix=lf"]

-   repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    -   id: fmt
        name: Fmt for krabitls
        args: ['--manifest-path=krabitls/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_cli
        args: ['--manifest-path=krabitls_cli/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint_handshakes
        args: ['--manifest-path=footprint/handshakes/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint cortex-m
        args: ['--manifest-path=footprint/cortex-m/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint risc-v
        args: ['--manifest-path=footprint/risc-v/Cargo.toml', '--']

# Local hooks: one cargo invocation per feature combo. Splitting them out
# (instead of chaining with `sh -c`) means the failing combo names itself
# in the pre-commit output, and there's no shell-quoting/portability tax.
-   repo: local
    hooks:
    # ---- krabitls clippy: 5 combos ----
    -   id: krabitls-clippy-default
        name: clippy krabitls (default)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    -   id: krabitls-clippy-rsa
        name: clippy krabitls (rsa)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets --features rsa -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    -   id: krabitls-clippy-validity
        name: clippy krabitls (validity)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets --features validity -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    -   id: krabitls-clippy-chacha20
        name: clippy krabitls (chacha20)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets --features chacha20 -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    -   id: krabitls-clippy-chacha20-rsa
        name: clippy krabitls (chacha20 + rsa)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets --features chacha20 --features rsa -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$

    # ---- krabitls host tests: all-features covers the matrix ----
    -   id: krabitls-test
        name: test krabitls (all-features)
        entry: cargo test --manifest-path=krabitls/Cargo.toml --all-features
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    # The canned-replay integration test is cfg-gated on
    # `not(rsa)` + `not(chacha20)`: the facade's ClientHello wire bytes
    # change under those features and diverge from the captured seed-0
    # fixture. Watches `testdata/` so fixture regen retriggers.
    -   id: krabitls-test-canned
        name: test krabitls (canned-replay, baseline combo)
        entry: cargo test --manifest-path=krabitls/Cargo.toml --no-default-features --features canned-replay,cert-der,cipher-aes
        language: system
        pass_filenames: false
        files: ^(krabitls|testdata)/.*\.(rs|toml|hex|md)$

    # ---- krabitls_cli clippy: 4 combos ----
    -   id: krabitls-cli-clippy-default
        name: clippy krabitls_cli (default)
        entry: cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-cli-clippy-rsa
        name: clippy krabitls_cli (rsa)
        entry: cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets --features rsa -- -D warnings
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-cli-clippy-chacha20
        name: clippy krabitls_cli (chacha20)
        entry: cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets --features chacha20 -- -D warnings
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-cli-clippy-rsa-chacha20
        name: clippy krabitls_cli (rsa + chacha20)
        entry: cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets --features rsa --features chacha20 -- -D warnings
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$

    # ---- krabitls_cli build: 4 combos ----
    -   id: krabitls-cli-build-default
        name: build krabitls_cli (default)
        entry: cargo build --manifest-path=krabitls_cli/Cargo.toml
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-cli-build-rsa
        name: build krabitls_cli (rsa)
        entry: cargo build --manifest-path=krabitls_cli/Cargo.toml --features rsa
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-cli-build-chacha20
        name: build krabitls_cli (chacha20)
        entry: cargo build --manifest-path=krabitls_cli/Cargo.toml --features chacha20
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$
    -   id: krabitls-cli-build-rsa-chacha20
        name: build krabitls_cli (rsa + chacha20)
        entry: cargo build --manifest-path=krabitls_cli/Cargo.toml --features rsa --features chacha20
        language: system
        pass_filenames: false
        files: ^(krabitls_cli|krabitls)/.*\.(rs|toml)$

    # ---- footprint/cortex-m (thumbv7m) ----
    -   id: cortex-m-clippy
        name: clippy footprint cortex-m (thumbv7m)
        entry: cargo clippy --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls --target thumbv7m-none-eabi -- -D warnings
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x)$
    -   id: cortex-m-build-default
        name: build footprint cortex-m (thumbv7m, default)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls --target thumbv7m-none-eabi
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-baseline
        name: build footprint cortex-m (thumbv7m, baseline)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls --target thumbv7m-none-eabi --features baseline
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-jedisct
        name: build footprint cortex-m (thumbv7m, jedisct)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_jedisct --target thumbv7m-none-eabi --features jedisct
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-rsa
        name: build footprint cortex-m (thumbv7m, rsa)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_rsa --target thumbv7m-none-eabi --features rsa
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-clippy-chacha20
        name: clippy footprint cortex-m (thumbv7m, chacha20)
        entry: cargo clippy --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_chacha --target thumbv7m-none-eabi --features chacha20 -- -D warnings
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x)$
    -   id: cortex-m-build-chacha20
        name: build footprint cortex-m (thumbv7m, chacha20)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_chacha --target thumbv7m-none-eabi --features chacha20
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-chacha20-baseline
        name: build footprint cortex-m (thumbv7m, chacha20 + baseline)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_chacha --target thumbv7m-none-eabi --features chacha20 --features baseline
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-rsa-baseline
        name: build footprint cortex-m (thumbv7m, rsa + baseline)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_rsa --target thumbv7m-none-eabi --features rsa --features baseline
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-facade
        name: build footprint cortex-m (thumbv7m, facade)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_facade --target thumbv7m-none-eabi --features canned-replay
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls|testdata)/.*\.(rs|toml|x|hex)$
    -   id: cortex-m-build-facade-baseline
        name: build footprint cortex-m (thumbv7m, facade + baseline)
        entry: cargo build --manifest-path=footprint/cortex-m/Cargo.toml --release --example krabitls_facade --target thumbv7m-none-eabi --features canned-replay --features baseline
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls|testdata)/.*\.(rs|toml|x|hex)$

    # ---- footprint/risc-v (riscv32imac) ----
    -   id: riscv-clippy
        name: clippy footprint risc-v (riscv32imac)
        entry: cargo clippy --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls --target riscv32imac-unknown-none-elf -- -D warnings
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x)$
    -   id: riscv-build-default
        name: build footprint risc-v (riscv32imac, default)
        entry: cargo build --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls --target riscv32imac-unknown-none-elf
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: riscv-build-baseline
        name: build footprint risc-v (riscv32imac, baseline)
        entry: cargo build --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls --target riscv32imac-unknown-none-elf --features baseline
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: riscv-build-jedisct
        name: build footprint risc-v (riscv32imac, jedisct)
        entry: cargo build --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls_jedisct --target riscv32imac-unknown-none-elf --features jedisct
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: riscv-build-rsa
        name: build footprint risc-v (riscv32imac, rsa)
        entry: cargo build --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls_rsa --target riscv32imac-unknown-none-elf --features rsa
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: riscv-build-chacha20
        name: build footprint risc-v (riscv32imac, chacha20)
        entry: cargo build --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls_chacha --target riscv32imac-unknown-none-elf --features chacha20
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls)/.*\.(rs|toml|x|hex)$
    -   id: riscv-build-facade
        name: build footprint risc-v (riscv32imac, facade)
        entry: cargo build --manifest-path=footprint/risc-v/Cargo.toml --release --example krabitls_facade --target riscv32imac-unknown-none-elf --features canned-replay
        language: system
        pass_filenames: false
        files: ^(footprint|krabitls|testdata)/.*\.(rs|toml|x|hex)$
