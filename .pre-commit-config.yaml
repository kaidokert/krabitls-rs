repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: mixed-line-ending
        args: ["--fix=lf"]

-   repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    -   id: fmt
        name: Fmt for krabitls
        args: ['--manifest-path=krabitls/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_nal_cli
        args: ['--manifest-path=krabitls_nal_cli/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for krabitls_fixtures
        args: ['--manifest-path=krabitls_fixtures/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint_handshakes
        args: ['--manifest-path=footprint/handshakes/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint cortex-m
        args: ['--manifest-path=footprint/cortex-m/Cargo.toml', '--']
    -   id: fmt
        name: Fmt for footprint risc-v
        args: ['--manifest-path=footprint/risc-v/Cargo.toml', '--']

# Local hooks: fmt + clippy + the unit-test suite. `--lib` runs the ~220 lib
# unit tests (fast, one binary) but skips the `tests/*.rs` integration binaries
# — the canned-handshake replays each compile+link+run separately and, with the
# doctests, are what made a commit take minutes. Those run in CI: the full
# `cargo test` (integration binaries + doctests) and feature-matrix in `host`
# (rust.yml), krabitls_fixtures seed KATs there too, the `cargo hack`
# feature-powerset in `host`, cross-compiled size builds in `footprint.yml`.
-   repo: local
    hooks:
    -   id: krabitls-clippy-default
        name: clippy krabitls (default)
        entry: cargo clippy --manifest-path=krabitls/Cargo.toml --tests --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^krabitls/.*\.(rs|toml)$
    -   id: krabitls-test-lib
        name: test krabitls (unit / --lib)
        entry: cargo test --manifest-path=krabitls/Cargo.toml --lib
        language: system
        pass_filenames: false
        files: ^(krabitls|krabitls_fixtures)/.*\.(rs|toml)$
    -   id: krabitls-fixtures-clippy
        name: clippy krabitls_fixtures
        entry: cargo clippy --manifest-path=krabitls_fixtures/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(krabitls_fixtures|krabitls)/.*\.(rs|toml)$
