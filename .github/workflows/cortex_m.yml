name: Cortex-M

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: cortex-m-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex-m:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv6m-none-eabi, thumbv7m-none-eabi]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          cortex_m_demo/target
        key: cortex-m-${{ matrix.target }}-${{ hashFiles('cortex_m_demo/Cargo.toml', 'krabitls/Cargo.toml') }}
        restore-keys: cortex-m-${{ matrix.target }}-

    # `cargo run` invokes the QEMU runner configured in
    # cortex_m_demo/.cargo/config.toml, so the semihosted `main` actually
    # executes and any handshake / fixture regression surfaces as a non-zero
    # exit. `cargo build` would only have type-checked + linked the binary.
    - name: Run krabitls example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls --target ${{ matrix.target }}

    - name: Run krabitls example (baseline)
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls --target ${{ matrix.target }} --features baseline

    - name: Run krabitls_jedisct example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_jedisct --target ${{ matrix.target }} --features jedisct
