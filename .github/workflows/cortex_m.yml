name: Cortex-M

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: cortex-m-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex-m:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv6m-none-eabi, thumbv7m-none-eabi]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          cortex_m_demo/target
        key: cortex-m-${{ matrix.target }}-${{ hashFiles('cortex_m_demo/Cargo.toml', 'krabitls/Cargo.toml') }}
        restore-keys: cortex-m-${{ matrix.target }}-

    # `cargo run` invokes the QEMU runner configured in
    # cortex_m_demo/.cargo/config.toml, so the semihosted `main` actually
    # executes and any handshake / fixture regression surfaces as a non-zero
    # exit. `cargo build` would only have type-checked + linked the binary.
    - name: Run krabitls example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls --target ${{ matrix.target }}

    - name: Run krabitls example (baseline)
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls --target ${{ matrix.target }} --features baseline

    - name: Run krabitls_jedisct example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_jedisct --target ${{ matrix.target }} --features jedisct

    - name: Run krabitls_chacha example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_chacha --target ${{ matrix.target }} --features chacha20

    # The captured-fixture buffers (8 KiB plaintext + 8 KiB flight) overflow
    # microbit's 16 KiB RAM by 16 B, so the M0 build skips this example.
    # RSA itself runs on M0 — it's the example's I/O buffers that don't fit.
    - name: Run krabitls_rsa example (M3 only)
      if: matrix.target == 'thumbv7m-none-eabi'
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_rsa --target ${{ matrix.target }} --features rsa

    # The footprint suite emits the README's reference table by
    # building baseline + real for each row, diffing `.text` (via
    # arm-none-eabi-size) and stack high-water (from the METRIC line).
    # M3 only — the README headline matrix is M3.
    - name: Install arm-none-eabi binutils (for size)
      if: matrix.target == 'thumbv7m-none-eabi'
      run: sudo apt-get install -y binutils-arm-none-eabi

    - name: Footprint suite (M3)
      if: matrix.target == 'thumbv7m-none-eabi'
      working-directory: cortex_m_demo
      run: |
        set -o pipefail
        python3 run_suite.py | tee -a "$GITHUB_STEP_SUMMARY"
