name: Cortex-M

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: cortex-m-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex-m:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7m-none-eabi

    - name: Install QEMU + arm-none-eabi binutils
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          cortex_m_demo/target
        key: cortex-m-${{ hashFiles('cortex_m_demo/Cargo.toml', 'krabitls/Cargo.toml') }}
        restore-keys: cortex-m-

    # `cargo run` invokes the QEMU runner configured in
    # cortex_m_demo/.cargo/config.toml, so the semihosted `main` actually
    # executes and any handshake / fixture regression surfaces as a non-zero
    # exit. `cargo build` would only have type-checked + linked the binary.
    - name: Run krabitls example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls --target thumbv7m-none-eabi

    - name: Run krabitls example (baseline)
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls --target thumbv7m-none-eabi --features baseline

    - name: Run krabitls_jedisct example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_jedisct --target thumbv7m-none-eabi --features jedisct

    - name: Run krabitls_chacha example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_chacha --target thumbv7m-none-eabi --features chacha20

    - name: Run krabitls_rsa example
      working-directory: cortex_m_demo
      run: cargo run --release --example krabitls_rsa --target thumbv7m-none-eabi --features rsa

    - name: Footprint suite
      working-directory: cortex_m_demo
      run: |
        set -o pipefail
        python3 run_suite.py | tee -a "$GITHUB_STEP_SUMMARY"
