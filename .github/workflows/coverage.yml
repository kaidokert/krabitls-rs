# SPDX-License-Identifier: Apache-2.0

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

name: Coverage

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage data
        working-directory: krabitls
        # Merge a few feature combos rather than one `--all-features` run:
        # `--all-features` turns on chacha20 + rsa, which compile out the facade
        # integration tests (`canned_handshake` / `strategy_coverage` are gated
        # `not(chacha20)` / `not(rsa)`), leaving the whole stream/engine path at
        # 0%. The default run exercises the facade; the rsa / chacha runs add
        # their crypto + the TLV (no-cert-der) parser.
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov --no-report --features rsa
          cargo llvm-cov --no-report --no-default-features --features chacha20,x25519-kx
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          file: krabitls/lcov.info
