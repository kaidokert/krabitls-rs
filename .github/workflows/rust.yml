name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          krabitls/target
          krabitls_fixtures/target
        key: pre-commit-${{ hashFiles('krabitls/Cargo.toml', 'krabitls_fixtures/Cargo.toml') }}
        restore-keys: pre-commit-
    - uses: pre-commit/action@v3.0.1

  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          krabitls/target
          krabitls_cli/target
        key: host-${{ hashFiles('krabitls/Cargo.toml', 'krabitls_cli/Cargo.toml') }}
        restore-keys: host-
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Format check (krabitls)
      run: cargo fmt --manifest-path=krabitls/Cargo.toml -- --check
    - name: Format check (krabitls_cli)
      run: cargo fmt --manifest-path=krabitls_cli/Cargo.toml -- --check

    - name: Clippy (default features)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets -- -D warnings
    - name: Clippy (feature = rsa)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features rsa -- -D warnings
    - name: Clippy (no-default, TLV cert parser)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --no-default-features --features cipher-aes --all-targets -- -D warnings
    - name: Clippy (feature = chacha20)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features chacha20 -- -D warnings
    - name: Clippy (feature = chacha20 + rsa)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features chacha20 --features rsa -- -D warnings
    - name: Clippy (feature = mldsa)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features mldsa -- -D warnings
    - name: Clippy (feature = mlkem)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features mlkem -- -D warnings
    - name: Clippy (feature = ecdsa)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features ecdsa -- -D warnings
    - name: Clippy (krabitls_cli, default + rsa + chacha20)
      run: |
        cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets -- -D warnings
        cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets --features rsa -- -D warnings
        cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets --features chacha20 -- -D warnings
        cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets --features rsa --features chacha20 -- -D warnings

    # Feature-powerset sweep — every realistic combo compiles, is warning-free,
    # and its tests run (catches a combo where a test silently cfg's out or a
    # test helper is dead only when a feature is off). At least one cipher;
    # depth 2 bounds the combinatorics. Moved here from the pre-commit hooks so
    # local commits stay fast.
    - name: cargo hack clippy (feature-powerset)
      run: cargo hack clippy --manifest-path=krabitls/Cargo.toml --feature-powerset --depth 2 --at-least-one-of cipher-aes,chacha20 --all-targets -- -D warnings
    - name: cargo hack test (feature-powerset)
      run: cargo hack test --manifest-path=krabitls/Cargo.toml --feature-powerset --depth 2 --at-least-one-of cipher-aes,chacha20

    - name: Build (default features)
      run: cargo build --manifest-path=krabitls/Cargo.toml --verbose
    - name: Build (feature = rsa)
      run: cargo build --manifest-path=krabitls/Cargo.toml --features rsa --verbose
    - name: Build (no-default, TLV cert parser)
      run: cargo build --manifest-path=krabitls/Cargo.toml --no-default-features --features cipher-aes --verbose
    - name: Build (feature = chacha20)
      run: cargo build --manifest-path=krabitls/Cargo.toml --features chacha20 --verbose

    - name: Test (default features)
      run: cargo test --manifest-path=krabitls/Cargo.toml --verbose
    - name: Test (feature = rsa)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features rsa --verbose
    - name: Test (no-default, TLV cert parser)
      run: cargo test --manifest-path=krabitls/Cargo.toml --no-default-features --features cipher-aes --verbose
    - name: Test (feature = chacha20)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features chacha20 --verbose
    - name: Test (feature = mldsa)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features mldsa --verbose
    - name: Test (feature = mlkem)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features mlkem --verbose
    - name: Test (feature = ecdsa)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features ecdsa --verbose
    - name: Test (all-features)
      run: cargo test --manifest-path=krabitls/Cargo.toml --all-features --verbose

    - name: Build krabitls_cli (default + rsa + chacha20)
      run: |
        cargo build --manifest-path=krabitls_cli/Cargo.toml --verbose
        cargo build --manifest-path=krabitls_cli/Cargo.toml --features rsa --verbose
        cargo build --manifest-path=krabitls_cli/Cargo.toml --features chacha20 --verbose
        cargo build --manifest-path=krabitls_cli/Cargo.toml --features rsa --features chacha20 --verbose
