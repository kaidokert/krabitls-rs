name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: thumbv7m-none-eabi
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          krabitls/target
          krabitls_cli/target
          cortex_m_demo/target
        key: pre-commit-${{ hashFiles('krabitls/Cargo.toml', 'krabitls_cli/Cargo.toml', 'cortex_m_demo/Cargo.toml') }}
        restore-keys: pre-commit-
    - uses: pre-commit/action@v3.0.1

  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          krabitls/target
          krabitls_cli/target
        key: host-${{ hashFiles('krabitls/Cargo.toml', 'krabitls_cli/Cargo.toml') }}
        restore-keys: host-

    - name: Format check (krabitls)
      run: cargo fmt --manifest-path=krabitls/Cargo.toml -- --check
    - name: Format check (krabitls_cli)
      run: cargo fmt --manifest-path=krabitls_cli/Cargo.toml -- --check

    - name: Clippy (default features)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets -- -D warnings
    - name: Clippy (feature = rsa)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features rsa -- -D warnings
    - name: Clippy (feature = validity)
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets --features validity -- -D warnings
    - name: Clippy (krabitls_cli)
      run: cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets -- -D warnings

    - name: Build (default features)
      run: cargo build --manifest-path=krabitls/Cargo.toml --verbose
    - name: Build (feature = rsa)
      run: cargo build --manifest-path=krabitls/Cargo.toml --features rsa --verbose
    - name: Build (feature = validity)
      run: cargo build --manifest-path=krabitls/Cargo.toml --features validity --verbose

    - name: Test (default features)
      run: cargo test --manifest-path=krabitls/Cargo.toml --verbose
    - name: Test (feature = rsa)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features rsa --verbose
    - name: Test (feature = validity)
      run: cargo test --manifest-path=krabitls/Cargo.toml --features validity --verbose

    - name: Build krabitls_cli
      run: cargo build --manifest-path=krabitls_cli/Cargo.toml --verbose
