name: Rust

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - uses: pre-commit/action@v3.0.1

  # Parallel matrix over the two axes that matter — carrier config (fixed
  # per-role default vs `bigint-heapless`) × a curated set of real deployment
  # profiles — replacing the serial `cargo hack` feature-powerset.
  # `--no-default-features` + explicit features give each cell exact control
  # (cert parser, cipher, carrier).
  krabitls:
    name: krabitls [${{ matrix.profile }}${{ matrix.carrier }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        carrier: ["", ",bigint-heapless"]
        profile:
          - "cert-der,cipher-aes"                                  # default
          - "cipher-aes"                                           # TLV parser (no der)
          - "cert-der,cipher-aes,rsa"
          - "cert-der,cipher-aes,rsa,rsa-1024"                     # +1024 (legacy)
          - "cert-der,cipher-aes,rsa,rsa-3072"                     # +3072 (heapless CAP-96)
          - "cert-der,cipher-aes,rsa,rsa-3072,rsa-4096"            # +4096 (heapless CAP-128)
          - "cert-der,cipher-aes,ecdsa"
          - "cert-der,cipher-aes,p256-kx"                          # P-256 ECDHE key exchange
          - "cert-der,cipher-aes,p256-kx,ecdsa,rsa"                # Azure-shaped: P-256 KX + ECDSA verify + RSA client-auth
          - "cert-der,chacha20"                                    # ChaCha-only cipher
          - "cert-der,cipher-aes,mldsa,mlkem"
          - "cert-der,cipher-aes,rsa,ecdsa,mldsa,mlkem,chacha20,p256-kx"   # full — every sig algo + every KX group
          - "cert-der,cipher-aes,rsa,ecdsa,backend-matrix"         # bnum/crypto-bigint carrier matrix
          - "cert-der,cipher-aes,rsa,rsa_pss_only"                 # PSS-only cert path
          - "cert-der,cipher-aes,jedisct"                          # jedisct HKDF backend
          - "cert-der,cipher-aes,ip-host"                          # IP-literal SAN matching
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.profile }}${{ matrix.carrier }}
    - name: Clippy
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --no-default-features --features "${{ matrix.profile }}${{ matrix.carrier }}" --all-targets -- -D warnings
    - name: Test
      run: cargo test --manifest-path=krabitls/Cargo.toml --no-default-features --features "${{ matrix.profile }}${{ matrix.carrier }}"

  # Own job, not a `krabitls` matrix cell, so it isn't multiplied by the
  # fixed/heapless axis.
  carrier-swap:
    name: carrier-swap [${{ matrix.carrier }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - carrier: crypto-bigint
            features: "cert-der,cipher-aes,rsa,rsa-1024,rsa-3072,rsa-4096,ecdsa,p256-kx,carrier-crypto-bigint"
          - carrier: bnum
            features: "cert-der,cipher-aes,rsa,rsa-1024,rsa-4096,carrier-bnum"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: carrier-${{ matrix.carrier }}
    - name: Clippy
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --no-default-features --features "${{ matrix.features }}" --all-targets -- -D warnings
    - name: Test
      run: cargo test --manifest-path=krabitls/Cargo.toml --no-default-features --features "${{ matrix.features }}"

  krabitls-cli:
    name: krabitls_cli [${{ matrix.features || 'default' }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "rsa", "chacha20", "rsa,chacha20", "ecdsa,rsa", "p256-kx,ecdsa,rsa"]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: cli-${{ matrix.features }}
    - name: Clippy + build + test
      run: |
        ARGS=""
        [ -n "${{ matrix.features }}" ] && ARGS="--features ${{ matrix.features }}"
        cargo clippy --manifest-path=krabitls_cli/Cargo.toml --all-targets $ARGS -- -D warnings
        cargo build --manifest-path=krabitls_cli/Cargo.toml $ARGS --verbose
        cargo test --manifest-path=krabitls_cli/Cargo.toml $ARGS
        # Reusable lib builds without the host feature (no std-only deps).
        cargo build --manifest-path=krabitls_cli/Cargo.toml --no-default-features --lib

  fixtures:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Test krabitls_fixtures seed KATs
      run: cargo test --manifest-path=krabitls_fixtures/Cargo.toml --verbose
