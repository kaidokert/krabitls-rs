name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        # Needed by the local `cortex-m-build` hook in .pre-commit-config.yaml.
        targets: thumbv7m-none-eabi
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          krabitls/target
        key: pre-commit-${{ hashFiles('krabitls/Cargo.toml') }}
        restore-keys: pre-commit-
    - uses: pre-commit/action@v3.0.1

  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          krabitls/target
        key: host-${{ hashFiles('krabitls/Cargo.toml') }}
        restore-keys: host-

    - name: Format check
      run: cargo fmt --manifest-path=krabitls/Cargo.toml -- --check
    - name: Clippy
      run: cargo clippy --manifest-path=krabitls/Cargo.toml --all-targets -- -D warnings
    - name: Build
      run: cargo build --manifest-path=krabitls/Cargo.toml --verbose
    - name: Test
      run: cargo test --manifest-path=krabitls/Cargo.toml --verbose
